  <style>
:root {
  --paper:#FAFAFA; --warm-tint:#F8F4EE; --ink:#1A1A1A; --ink-soft:#333;
  --muted:#999; --hairline:#E8E8E8; --kiln:#B8674E; --kiln-deep:#8E4A36;
  --teal:#5FA39E; --matcha:#A8C49A;
  --font-display:'Cormorant Garamond','Cormorant',Georgia,serif;
  --font-sans:'Work Sans',-apple-system,sans-serif;
  --dur-quick:240ms; --dur-base:400ms; --dur-slow:700ms;
  --ease-entrance:cubic-bezier(.16,1,.3,1);
  --ease-standard:cubic-bezier(.4,0,.2,1);
  --ease-organic:cubic-bezier(.45,0,.55,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:clip}
body{background:var(--warm-tint);color:var(--ink);font-family:var(--font-sans);
  font-weight:300;-webkit-font-smoothing:antialiased;line-height:1.6;overflow-x:clip}
a{color:inherit;text-decoration:none}
.page{max-width:1400px;margin:0 auto;padding:0 9rem}
.eyebrow{font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:400}
.nav{display:flex;justify-content:space-between;align-items:center;padding:1.5rem 9rem;
  border-bottom:1px solid var(--hairline);background:rgba(248,244,238,.92);
  backdrop-filter:blur(10px);position:sticky;top:0;z-index:50}
.brand{font-family:var(--font-display);font-size:1.25rem;letter-spacing:.5px;font-weight:400}
.nav-links{display:flex;gap:2.5rem;font-size:.78rem;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--ink-soft)}
.nav-links a{transition:color var(--dur-quick) var(--ease-standard)}
.nav-links a:hover,.nav-links a.active{color:var(--ink)}
.nav-hamburger{display:none;flex-direction:column;gap:5px;background:none;
  border:none;cursor:pointer;padding:4px}
.nav-hamburger span{display:block;width:22px;height:1px;background:var(--ink);
  transition:transform var(--dur-base) var(--ease-standard),opacity var(--dur-base) var(--ease-standard)}
.nav-hamburger.is-open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.nav-hamburger.is-open span:nth-child(2){opacity:0}
.nav-hamburger.is-open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.nav-mobile-drawer{display:none;position:fixed;inset:0;background:var(--warm-tint);
  z-index:49;padding:6rem 2rem 2rem;flex-direction:column;gap:2rem}
.nav-mobile-drawer.is-open{display:flex}
.nav-mobile-drawer a{font-size:2rem;font-family:var(--font-display);font-weight:300;
  color:var(--ink);border-bottom:1px solid var(--hairline);padding-bottom:1.25rem}
.btn{display:inline-block;padding:1rem 2rem;background:var(--ink);color:var(--paper);
  font-size:.74rem;letter-spacing:1.8px;text-transform:uppercase;border:1px solid var(--ink);
  cursor:pointer;transition:background var(--dur-quick) var(--ease-standard),
  color var(--dur-quick) var(--ease-standard),border-color var(--dur-quick) var(--ease-standard)}
.btn:hover{background:var(--kiln-deep);border-color:var(--kiln-deep)}
.link-arrow{font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--ink);position:relative;padding-bottom:4px}
.link-arrow::after{content:'';position:absolute;left:0;bottom:0;height:1px;width:100%;
  background:currentColor;transform-origin:left center;
  transition:transform var(--dur-base) var(--ease-standard)}
.link-arrow:hover{color:var(--kiln)}
.link-arrow:hover::after{transform-origin:right center;transform:scaleX(0)}
.foot{padding:3rem 0 2rem;display:flex;justify-content:space-between;align-items:center;
  font-size:.74rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);
  border-top:1px solid var(--hairline);margin-top:4rem}
[data-reveal]{opacity:0;transform:translateY(20px);
  transition:opacity var(--dur-slow) var(--ease-entrance),transform var(--dur-slow) var(--ease-entrance)}
[data-reveal].is-revealed{opacity:1;transform:translateY(0)}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  [data-reveal]{opacity:1;transform:none}}
@media(max-width:1200px){.page{padding:0 6rem}.nav{padding:1.5rem 6rem}}
@media(max-width:960px){.page{padding:0 3.5rem}.nav{padding:1.5rem 3.5rem}}
@media(max-width:640px){
  .page{padding:0 1.75rem}.nav{padding:1rem 1.75rem}
  .nav-links{display:none}.nav-hamburger{display:flex}
  .foot{flex-direction:column;gap:.75rem;align-items:flex-start;padding:2rem 0 1.5rem}}
@media(max-width:400px){.page{padding:0 1.25rem}.nav{padding:1rem 1.25rem}}

/* ── Contact page specific ── */
.contact-wrap{max-width:680px;padding:8rem 0 6rem}
.contact-wrap .eyebrow{display:block;margin-bottom:1.5rem}
.contact-wrap h1{font-family:var(--font-display);font-size:4rem;font-weight:300;

.contact-email:hover{color:var(--kiln)}

.contact-also{font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase;

.contact-ig{font-size:.9rem;font-weight:300;color:var(--ink-soft);
  transition:color var(--dur-quick) var(--ease-standard)}
.contact-ig:hover{color:var(--kiln)}

@media(max-width:640px){

<script>
(function(){
  const h=document.querySelector('.nav-hamburger'),d=document.querySelector('.nav-mobile-drawer');
  h.addEventListener('click',()=>{
    const open=d.classList.toggle('is-open');
    h.classList.toggle('is-open',open);
    document.body.style.overflow=open?'hidden':'';
  });
  d.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{
    d.classList.remove('is-open');h.classList.remove('is-open');
    document.body.style.overflow='';
  }));
  const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduced){document.querySelectorAll('[data-reveal]').forEach(el=>el.classList.add('is-revealed'));}
  else{
    const io=new IntersectionObserver(entries=>{
      entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-revealed');io.unobserve(e.target);}});
    },{threshold:0.08});
    document.querySelectorAll('[data-reveal]').forEach(el=>io.observe(el));
  }
})();
</script>
